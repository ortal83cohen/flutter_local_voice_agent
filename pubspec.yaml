name: flutter_local_voice_agent
description: >-
  Complete on-device speech-to-text and text-to-speech for Flutter.
  One local voice agent handles microphone, recognition, reply, and playback.
version: 0.1.5
homepage: https://github.com/ortal83cohen/flutter_local_voice_agent
repository: https://github.com/ortal83cohen/flutter_local_voice_agent
issue_tracker: https://github.com/ortal83cohen/flutter_local_voice_agent/issues
documentation: https://github.com/ortal83cohen/flutter_local_voice_agent/tree/main/doc
topics:
  - speech-to-text
  - text-to-speech
  - speech-recognition
  - offline
  - voice
screenshots:
  - description: >-
      On-device Flutter voice agent: no cloud, microphone-to-speaker
      speech-to-text and text-to-speech, one agent API.
    path: image.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  crypto: ^3.0.6
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.localvoice.flutter_local_voice_agent
        pluginClass: FlutterLocalVoiceAgentPlugin
      ios:
        pluginClass: FlutterLocalVoiceAgentPlugin
      macos:
        pluginClass: FlutterLocalVoiceAgentPlugin
      windows:
        pluginClass: FlutterLocalVoiceAgentPlugin
      linux:
        pluginClass: FlutterLocalVoiceAgentPlugin
      web:
        pluginClass: FlutterLocalVoiceAgentWeb
        fileName: flutter_local_voice_agent_web.dart
  assets:
    - assets/sherpa_onnx_web/sherpa-onnx-wasm-web.wasm
    - assets/sherpa_onnx_web/sherpa-onnx-wasm-web.js
    - assets/sherpa_onnx_web/sherpa-onnx-asr.js
    - assets/sherpa_onnx_web/sherpa-onnx-tts.js
    - assets/sherpa_onnx_web/sherpa-onnx-vad.js
