name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    steps:
      - name: Require release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: test -n "$RELEASE_GITHUB_TOKEN" || (echo 'Missing repository secret RELEASE_GITHUB_TOKEN.' >&2; exit 1)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - name: Run package checks
        run: bash tool/check.sh
      - name: Load occupied pub.dev versions
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://pub.dev/api/packages/flutter_local_voice_agent"
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print(f"Package is not published yet; treating {url} as empty occupancy.")
              payload = {"versions": []}
          with open("occupied-pubdev-versions.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          echo "OCCUPIED_VERSIONS=$(python3 tool/occupied_pubdev_versions.py occupied-pubdev-versions.json)" >> "$GITHUB_ENV"
      - name: Bump patch version
        id: bump
        run: echo "version=$(sh tool/bump_patch_version.sh)" >> "$GITHUB_OUTPUT"
      - name: Reject existing tag
        run: |
          git fetch --tags --force
          test -z "$(git ls-remote --tags origin refs/tags/v${{ steps.bump.outputs.version }})"
      - name: Commit release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md
          git commit -m 'chore(release): v${{ steps.bump.outputs.version }}'
          git push origin HEAD:main
      - name: Push release tag
        run: |
          git tag -a "v${{ steps.bump.outputs.version }}" -m "Release v${{ steps.bump.outputs.version }}"
          git push origin "refs/tags/v${{ steps.bump.outputs.version }}"
