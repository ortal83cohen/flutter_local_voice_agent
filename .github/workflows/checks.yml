name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  package:
    name: Flutter package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: flutter --version
      - run: bash tool/check.sh
