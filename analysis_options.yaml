include: package:flutter_lints/flutter.yaml

# Web-conditional libraries under lib/ are analyzed. The exclude list only
# drops generated or host-project trees, not the Flutter web session code.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - example/build/**
    - .dart_tool/**

linter:
  rules:
    public_member_api_docs: true
